<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: Arial, sans-serif; }
    .total { font-weight: bold; }
  </style>
</head>
<body>

<h1>Invoice</h1>

<p>Name: {{data.name}}</p>
<p>Amount: {{data.amount}}</p>

{{#if data.discount}}
  <p>Discount: {{data.discount}}%</p>
{{else}}
  <p>No discount applied</p>
{{/if}}

<p class="total">
  Total: {{data.total}}
</p>

{{#if meta.note}}
  <hr />
  <p>Note: {{meta.note}}</p>
{{/if}}

</body>
</html>
